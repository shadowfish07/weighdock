name: 功能建议
description: 描述使用场景和最小改进，不包含个人资料
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 建议的行为与取舍
      description: 请勿填写健康记录或凭据；功能建议不代表已获任何云端/权限操作授权
